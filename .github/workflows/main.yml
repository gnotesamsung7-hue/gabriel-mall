name: Build Gabriel Mall APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Wi-Fi co-op plugin
        run: |
          J=android/app/src/main/java/com/markdave/gabrielmall
          mkdir -p $J
          cp native/LanPlugin.java native/MainActivity.java $J/
          sed -i "/^dependencies {/a\    implementation 'org.java-websocket:Java-WebSocket:1.5.6'" android/app/build.gradle
          grep -n "Java-WebSocket" android/app/build.gradle
          ls $J

      - name: Camera permission, landscape, version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
          sed -i 's#android:name=".MainActivity"#& android:screenOrientation="sensorLandscape"#' $M
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -n "CAMERA\|screenOrientation" $M
          grep -n "versionCode\|versionName" $G

      - name: App icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          R = 'android/app/src/main/res'
          full = Image.open('icon.png').convert('RGBA')
          fg = Image.open('icon_fg.png').convert('RGBA') if os.path.exists('icon_fg.png') else full
          for n, s in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = f'{R}/mipmap-{n}'
              os.makedirs(d, exist_ok=True)
              full.resize((s, s), Image.LANCZOS).save(f'{d}/ic_launcher.png')
              # round legacy icon: centre of the padded art, cut to a circle
              big = fg.resize((s * 3 // 2, s * 3 // 2), Image.LANCZOS)
              o = (big.width - s) // 2
              r = big.crop((o, o, o + s, o + s))
              m = Image.new('L', (s, s), 0); ImageDraw.Draw(m).ellipse([0, 0, s - 1, s - 1], fill=255)
              rr = Image.new('RGBA', (s, s), (0, 0, 0, 0)); rr.paste(r, (0, 0), m); rr.save(f'{d}/ic_launcher_round.png')
              # adaptive icon foreground (108dp canvas)
              f = s * 108 // 48
              fg.resize((f, f), Image.LANCZOS).save(f'{d}/ic_launcher_foreground.png')
          print('icons done')
          PY
          V=android/app/src/main/res/values/ic_launcher_background.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0E1721</color>\n</resources>\n' > $V
          cat $V
          ls android/app/src/main/res/mipmap-anydpi-v26 || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../gabriel-mall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gabriel-mall-apk
          path: gabriel-mall.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gabriel Shopping Mall v1.0.${{ github.run_number }}
          body: Scan the QR code in the game's Share & secrets screen, or download gabriel-mall.apk below.
          files: gabriel-mall.apk
          make_latest: true
