name: Build Gabriel Mall APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Gabriel Mall" com.markdave.gabrielmall --web-dir www
          npx cap add android
          npx cap sync android

      - name: Camera permission, landscape, version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
          sed -i 's#android:name=".MainActivity"#& android:screenOrientation="sensorLandscape"#' $M
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -n "CAMERA\|screenOrientation" $M
          grep -n "versionCode\|versionName" $G

      - name: App icon
        run: |
          R=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
          done
          rm -rf $R/mipmap-anydpi-v26

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../gabriel-mall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gabriel-mall-apk
          path: gabriel-mall.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gabriel Shopping Mall v1.0.${{ github.run_number }}
          body: Scan the QR code in the game's Share & secrets screen, or download gabriel-mall.apk below.
          files: gabriel-mall.apk
          make_latest: true
